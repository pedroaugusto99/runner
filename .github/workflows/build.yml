name: Build

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    name: Testes Multiplataforma
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: |
            assinatura/go.sum
            simulador/go.sum

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Empacotar e testar assinador.jar
        run: mvn -B -ntp package
        working-directory: assinador

      - name: Verificar formatação (gofmt)
        shell: bash
        run: |
          fmt=$(gofmt -l assinatura simulador)
          if [ -n "$fmt" ]; then
            echo "Arquivos Go não formatados (rode 'gofmt -w'):"
            echo "$fmt"
            exit 1
          fi

      - name: Verificar assinatura
        run: go vet ./...
        working-directory: assinatura

      # Com o assinador.jar empacotado acima e o JDK disponível, os testes de
      # integração (subprocess real e HTTP real) são executados em cada SO.
      - name: Testar assinatura
        run: go test ./...
        working-directory: assinatura

      - name: Verificar simulador
        run: go vet ./...
        working-directory: simulador

      - name: Testar simulador
        run: go test ./...
        working-directory: simulador

  build:
    name: Cross-Compilation
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: |
            assinatura/go.sum
            simulador/go.sum

      - name: Gerar Binários
        run: |
          mkdir -p dist
          VERSION=${GITHUB_REF_NAME}
          COMMIT=${GITHUB_SHA::7}
          ASSINATURA_LDFLAGS="-X main.version=$VERSION -X main.commit=$COMMIT"
          SIMULADOR_LDFLAGS="-X main.version=$VERSION"
          # Build para Linux
          GOOS=linux GOARCH=amd64 go build -C assinatura -ldflags "$ASSINATURA_LDFLAGS" -o ../dist/assinatura-linux-amd64 .
          GOOS=linux GOARCH=amd64 go build -C simulador -ldflags "$SIMULADOR_LDFLAGS" -o ../dist/simulador-linux-amd64 .
          # Build para Windows
          GOOS=windows GOARCH=amd64 go build -C assinatura -ldflags "$ASSINATURA_LDFLAGS" -o ../dist/assinatura-windows-amd64.exe .
          GOOS=windows GOARCH=amd64 go build -C simulador -ldflags "$SIMULADOR_LDFLAGS" -o ../dist/simulador-windows-amd64.exe .
          # Build para macOS
          GOOS=darwin GOARCH=amd64 go build -C assinatura -ldflags "$ASSINATURA_LDFLAGS" -o ../dist/assinatura-macos-amd64 .
          GOOS=darwin GOARCH=amd64 go build -C simulador -ldflags "$SIMULADOR_LDFLAGS" -o ../dist/simulador-macos-amd64 .

      - name: Publicar Artefatos
        uses: actions/upload-artifact@v4
        with:
          name: assinatura-binaries
          path: dist/*
