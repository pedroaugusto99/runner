name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publicar Release Oficial
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: |
            assinatura/go.sum
            simulador/go.sum

      - name: Instalar Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Gerar Binários e Checksums
        run: |
          mkdir -p dist
          VERSION=${{ github.ref_name }}
          COMMIT=${GITHUB_SHA::7}
          ASSINATURA_LDFLAGS="-X main.version=$VERSION -X main.commit=$COMMIT"
          SIMULADOR_LDFLAGS="-X main.version=$VERSION"
          GOOS=linux GOARCH=amd64 go build -C assinatura -ldflags "$ASSINATURA_LDFLAGS" -o ../dist/assinatura-$VERSION-linux-amd64 .
          GOOS=windows GOARCH=amd64 go build -C assinatura -ldflags "$ASSINATURA_LDFLAGS" -o ../dist/assinatura-$VERSION-windows-amd64.exe .
          GOOS=darwin GOARCH=amd64 go build -C assinatura -ldflags "$ASSINATURA_LDFLAGS" -o ../dist/assinatura-$VERSION-macos-amd64 .
          GOOS=linux GOARCH=amd64 go build -C simulador -ldflags "$SIMULADOR_LDFLAGS" -o ../dist/simulador-$VERSION-linux-amd64 .
          GOOS=windows GOARCH=amd64 go build -C simulador -ldflags "$SIMULADOR_LDFLAGS" -o ../dist/simulador-$VERSION-windows-amd64.exe .
          GOOS=darwin GOARCH=amd64 go build -C simulador -ldflags "$SIMULADOR_LDFLAGS" -o ../dist/simulador-$VERSION-macos-amd64 .
          cd dist
          sha256sum * > checksums.txt
          cd ..

      - name: Assinar Binários
        run: |
          cosign sign-blob --yes dist/assinatura-${{ github.ref_name }}-linux-amd64
          cosign sign-blob --yes dist/assinatura-${{ github.ref_name }}-windows-amd64.exe
          cosign sign-blob --yes dist/assinatura-${{ github.ref_name }}-macos-amd64
          cosign sign-blob --yes dist/simulador-${{ github.ref_name }}-linux-amd64
          cosign sign-blob --yes dist/simulador-${{ github.ref_name }}-windows-amd64.exe
          cosign sign-blob --yes dist/simulador-${{ github.ref_name }}-macos-amd64
          cosign sign-blob --yes dist/checksums.txt

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
